name: Website publiceren

# Neemt de laatste versie van de testsite over en zet ze online:
#   - op dbreininghorses.be (webruimte bij one.com, via SFTP)
#   - op GitHub Pages (reservekopie, verwijst met canonieke links naar dbreininghorses.be)
# Starten: tabblad Actions → "Website publiceren" → Run workflow.
# Ook elke push naar main start deze stap.
# De stap naar one.com loopt pas als de geheimen SFTP_SERVER, SFTP_GEBRUIKER en
# SFTP_WACHTWOORD ingevuld zijn (zie scripts/naar-one-com.sh).
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publiceren
  cancel-in-progress: false

jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
      SFTP_GEBRUIKER: ${{ secrets.SFTP_GEBRUIKER }}
      SFTP_WACHTWOORD: ${{ secrets.SFTP_WACHTWOORD }}
      SFTP_MAP: ${{ vars.SFTP_MAP }}
    steps:
      - uses: actions/checkout@v4

      - name: Testsite ophalen
        run: git clone --depth 1 https://github.com/RenaatDelporte/deboever-test.git /tmp/testsite

      - name: Klaarmaken voor de echte website
        run: bash scripts/overnemen-van-testsite.sh /tmp/testsite site https://dbreininghorses.be

      - name: Bewaren in de repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "Geen wijzigingen ten opzichte van de vorige publicatie."
          else
            TEST=$(git -C /tmp/testsite rev-parse --short HEAD)
            git commit -m "Testsite overgenomen (versie $TEST)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Op one.com zetten (dbreininghorses.be)
        if: env.SFTP_WACHTWOORD != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          bash scripts/naar-one-com.sh site

      - name: Melding als one.com nog niet ingesteld is
        if: env.SFTP_WACHTWOORD == ''
        run: echo "::warning::De website staat alleen op GitHub Pages. Vul de geheimen SFTP_SERVER, SFTP_GEBRUIKER en SFTP_WACHTWOORD in om ze op dbreininghorses.be te zetten."
